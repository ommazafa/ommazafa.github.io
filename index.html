<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OAK — Portal</title>
  <!-- No description meta, no OG tags, no robots index -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <style>
    :root {
      --ink: #0E0C09;
      --ink-soft: #5C5548;
      --ink-faint: #9C9589;
      --cream: #F9F6F0;
      --cream-warm: #F2EDE3;
      --cream-deep: #E8DFD0;
      --gold: #A8834A;
      --gold-pale: #E8D5B0;
      --white: #FFFFFF;
      --error: #C0392B;
      --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-font-smoothing: antialiased; }

    body {
      background: var(--cream);
      font-family: 'DM Sans', system-ui, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
    }

    /* Background rings */
    .bg-ring {
      position: fixed;
      border-radius: 50%;
      border: 1px solid rgba(168,131,74,0.12);
      pointer-events: none;
    }
    .bg-ring-1 { width: 600px; height: 600px; top: 50%; left: 50%; transform: translate(-50%, -50%); }
    .bg-ring-2 { width: 900px; height: 900px; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.5; }
    .bg-ring-3 { width: 1200px; height: 1200px; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.25; }

    /* Login Box */
    .login-wrap {
      position: relative;
      z-index: 10;
      width: 100%;
      max-width: 420px;
      padding: 24px;
      animation: appear 0.8s cubic-bezier(0.16,1,0.3,1) both;
    }

    @keyframes appear {
      from { opacity: 0; transform: translateY(24px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .login-card {
      background: var(--white);
      border: 1px solid var(--cream-deep);
      border-radius: 16px;
      padding: 48px 40px;
      box-shadow: 0 32px 64px rgba(14,12,9,0.08);
    }

    .login-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 40px;
    }

    .login-logo img {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .login-logo-text {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 1.25rem;
      font-weight: 500;
      color: var(--ink);
    }

    .login-logo-text em {
      font-style: italic;
      font-weight: 300;
      color: var(--ink-soft);
    }

    .login-title {
      font-family: 'Cormorant Garamond', Georgia, serif;
      font-size: 2rem;
      font-weight: 300;
      color: var(--ink);
      margin-bottom: 6px;
    }

    .login-sub {
      font-size: 0.85rem;
      color: var(--ink-faint);
      font-weight: 300;
      margin-bottom: 36px;
    }

    .field {
      margin-bottom: 18px;
    }

    .field label {
      display: block;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--ink-soft);
      margin-bottom: 8px;
      font-family: 'DM Sans', sans-serif;
    }

    .field input {
      width: 100%;
      padding: 13px 16px;
      border: 1.5px solid var(--cream-deep);
      border-radius: 8px;
      background: var(--cream);
      font-family: 'DM Sans', sans-serif;
      font-size: 0.95rem;
      color: var(--ink);
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s;
      -webkit-font-smoothing: antialiased;
    }

    .field input:focus {
      border-color: var(--gold);
      box-shadow: 0 0 0 3px rgba(168,131,74,0.1);
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      background: var(--ink);
      color: var(--cream);
      border: none;
      border-radius: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: 0.85rem;
      letter-spacing: 0.08em;
      font-weight: 500;
      margin-top: 8px;
      cursor: pointer;
      transition: background 0.3s, transform 0.2s;
    }

    .login-btn:hover { background: var(--gold); }
    .login-btn:active { transform: scale(0.99); }

    .login-error {
      display: none;
      margin-top: 16px;
      padding: 12px 16px;
      background: rgba(192,57,43,0.06);
      border: 1px solid rgba(192,57,43,0.2);
      border-radius: 8px;
      color: var(--error);
      font-size: 0.82rem;
      text-align: center;
    }

    .login-error.show { display: block; }

    .login-footer {
      margin-top: 32px;
      text-align: center;
      font-size: 0.72rem;
      color: var(--ink-faint);
      letter-spacing: 0.04em;
    }
  </style>
</head>
<body>

  <div class="bg-ring bg-ring-1"></div>
  <div class="bg-ring bg-ring-2"></div>
  <div class="bg-ring bg-ring-3"></div>

  <div class="login-wrap">
    <div class="login-card">
      <div class="login-logo">
        <img src="../oakcreations/assets/oak-tree.png" alt="OAK" />
        <span class="login-logo-text">OAK <em>Portal</em></span>
      </div>
      <h1 class="login-title">Welcome back.</h1>
      <p class="login-sub">Enter your credentials to manage OAK Creations.</p>

      <form id="loginForm" autocomplete="off">
        <div class="field">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" autocomplete="new-username" spellcheck="false" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" />
        </div>
        <button type="submit" class="login-btn">Enter the Portal</button>
        <div class="login-error" id="loginError">Incorrect credentials. Try again.</div>
      </form>

      <div class="login-footer">OAK Creations · Private Portal</div>
    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
